<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrandPilot | AI 营销策略工作台</title><style>
:root{--bg:#0b1020;--panel:#151d32;--panel2:#1b2540;--line:#2a3754;--ink:#f3f6ff;--muted:#9aabc9;--accent:#8ff5ce;--violet:#b8a5ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -20%,#26365b 0,transparent 50%),var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif}header{padding:30px max(22px,calc((100vw - 1160px)/2));border-bottom:1px solid var(--line)}.logo{font-size:13px;font-weight:800;letter-spacing:3px;color:var(--accent)}h1{font-size:clamp(28px,4vw,42px);line-height:1.2;margin:14px 0 9px}header p{color:var(--muted);max-width:740px;margin:0}.wrap{max-width:1200px;margin:auto;padding:26px 20px 60px;display:grid;grid-template-columns:380px minmax(0,1fr);gap:22px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 15px 35px #0002}.panel h2{font-size:18px;margin:0 0 8px}.sub{color:var(--muted);font-size:13px;margin:0 0 20px}label{display:block;font-weight:650;font-size:13px;margin:14px 0 6px}input,textarea,select{width:100%;background:#0d1528;color:var(--ink);border:1px solid #344461;border-radius:10px;padding:11px 12px;font:inherit;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{resize:vertical;min-height:70px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.checks{display:flex;flex-wrap:wrap;gap:8px}.check{display:flex;align-items:center;gap:5px;background:#101a2e;border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:12px;margin:0;cursor:pointer}.check input{width:auto;accent-color:#8ff5ce}.primary,.secondary{border:0;border-radius:11px;padding:12px 16px;font:inherit;font-weight:750;cursor:pointer}.primary{background:var(--accent);color:#10221d;width:100%;margin-top:22px}.secondary{background:#253550;color:var(--ink);border:1px solid #3a4c6c}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}.hint{color:var(--muted);font-size:12px;margin-top:12px}.empty{border:1px dashed #3a4c6c;border-radius:15px;padding:50px 25px;text-align:center;color:var(--muted)}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:2px}.result h3{font-size:17px;margin:24px 0 10px}.result p{margin:7px 0}.result ul{margin:8px 0;padding-left:20px}.result li{margin:6px 0}.tag{display:inline-block;padding:4px 9px;border-radius:30px;background:#253b46;color:var(--accent);font-size:12px;margin:3px}.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{background:var(--panel2);border-radius:11px;padding:13px}.metric strong{display:block;font-size:18px;color:var(--accent)}.metric small{color:var(--muted)}.step{padding:13px 14px;background:#111a2e;border-left:3px solid var(--violet);border-radius:9px;margin:9px 0}.step strong{color:#e5dfff}.copy{background:#0b1426;border:1px solid var(--line);padding:13px;border-radius:11px;white-space:pre-wrap}.footer{font-size:12px;color:var(--muted);margin-top:20px;border-top:1px solid var(--line);padding-top:12px}#toast{position:fixed;bottom:20px;right:20px;background:var(--accent);color:#14231d;padding:10px 16px;border-radius:9px;display:none;font-weight:700}@media(max-width:820px){.wrap{grid-template-columns:1fr}.metric-grid{grid-template-columns:1fr 1fr}header{padding:26px 20px}}@media print{body{background:white;color:black}header,.inputpanel,.actions,.hint{display:none!important}.wrap{display:block;padding:0}.panel{border:0;box-shadow:none;background:white}.result,.result *{color:black!important}.step,.metric,.copy{background:white;border:1px solid #ccc}#output{display:block!important}}
</style></head><body><header><div class="logo">BRANDPILOT / MARKETING OPS</div><h1>把营销 Brief，变成可执行的 Campaign Plan.</h1><p>一站式生成 RACE 全链路策略、平台内容、预算分配、KPI 测算与 AI 深度创意提示词。面向品牌营销、整合传播与客户执行场景。</p></header><main class="wrap"><section class="panel inputpanel"><h2>01 / Campaign Brief</h2><p class="sub">输入品牌信息，自动生成结构化营销提案初稿。</p><label for="brand">品牌 / 产品名称 *</label><input id="brand" value="Herbal Glow 草本香氛蜡烛" maxlength="90"><label for="industry">行业</label><select id="industry"><option>美妆个护 / 生活方式</option><option>消费电子 / 科技</option><option>食品饮料</option><option>时尚 / 潮流</option><option>文化娱乐 / 游戏</option><option>汽车 / 出行</option><option>其他</option></select><label for="product">核心卖点 / 品牌差异化 *</label><textarea id="product">东方草本香气、现代极简美学、下班后的情绪疗愈仪式感</textarea><label for="audience">目标受众 *</label><textarea id="audience">22–35岁一二线城市职场女性，关注情绪健康、家居美学与生活品质</textarea><div class="two"><div><label for="objective">主要目标</label><select id="objective"><option value="awareness">提升品牌认知</option><option value="engagement">促进互动种草</option><option value="conversion">促进销售转化</option><option value="retention">提高复购留存</option></select></div><div><label for="duration">投放周期</label><select id="duration"><option value="1">1 个月</option><option value="3" selected>3 个月</option><option value="6">6 个月</option><option value="12">12 个月</option></select></div></div><div class="two"><div><label for="budget">总预算（人民币）</label><input id="budget" type="number" min="1000" max="100000000" value="80000"></div><div><label for="tone">品牌语气</label><select id="tone"><option>温暖治愈</option><option>年轻有梗</option><option>高级简约</option><option>专业可信</option><option>大胆先锋</option></select></div></div><label>传播渠道（可多选）</label><div class="checks" id="channels"><label class="check"><input type="checkbox" value="小红书" checked>小红书</label><label class="check"><input type="checkbox" value="抖音" checked>抖音</label><label class="check"><input type="checkbox" value="微信公众号">微信公众号</label><label class="check"><input type="checkbox" value="微博">微博</label><label class="check"><input type="checkbox" value="B站">B站</label><label class="check"><input type="checkbox" value="线下快闪" checked>线下快闪</label></div><button class="primary" id="generate">✦ 生成营销解决方案</button><p class="hint">无需注册或上传数据。所有计算在浏览器本地完成；AI 创意提示词可复制到大模型继续深化。</p></section><section class="panel"><div class="actions"><button class="secondary" id="copy" disabled>复制完整方案</button><button class="secondary" id="download" disabled>导出 Markdown</button><button class="secondary" id="print" disabled>打印 / 保存 PDF</button></div><div id="output" class="empty"><div style="font-size:36px;margin-bottom:10px">✦</div>填写左侧 Brief，点击「生成营销解决方案」<br><small>策略框架 · 渠道分配 · KPI · 内容创意 · AI Prompt</small></div></section></main><div id="toast">已复制</div><script>
const $=id=>document.getElementById(id);let report='';const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'¥'+Math.round(n).toLocaleString('zh-CN');const toast=t=>{const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)};
const channelAdvice={'小红书':'围绕真实生活场景打造「问题—体验—解决方案」种草笔记，联动垂类 KOC/KOL，搜索词覆盖核心消费需求。','抖音':'制作前 3 秒强钩子的短视频，设置达人演示、情绪共鸣与行动引导，测试素材完播率。','微信公众号':'沉淀品牌故事、产品原理与用户案例，结合社群推送引导私域转化。','微博':'结合节日热点、话题互动和联名事件提升讨论度与品牌声量。','B站':'以中长视频呈现真实测评、幕后故事与知识内容，建立可信度。','线下快闪':'打造可体验、可拍摄、可分享的沉浸式触点，扫码引流线上并收集用户反馈。'};
const weights={'小红书':27,'抖音':25,'微信公众号':12,'微博':12,'B站':14,'线下快闪':28};
const objectives={awareness:['认知增长','覆盖人数（Reach）','CPM / 品牌搜索指数'],engagement:['互动种草','互动率（Engagement Rate）','收藏率 / 分享率'],conversion:['销售转化','有效线索 / 订单量','CPA / ROAS'],retention:['用户留存','复购率 / 留存率','会员活跃度']};
function build(){const brand=$('brand').value.trim(),product=$('product').value.trim(),audience=$('audience').value.trim();if(!brand||!product||!audience){toast('请填写品牌、卖点和受众');return}const budget=Number($('budget').value),months=Number($('duration').value);if(!Number.isFinite(budget)||budget<1000||budget>1e8){toast('预算请输入 1,000–100,000,000');return}const channels=[...document.querySelectorAll('#channels input:checked')].map(x=>x.value);if(!channels.length){toast('请至少选择一个渠道');return}const tone=$('tone').value,industry=$('industry').value,goal=objectives[$('objective').value],sum=channels.reduce((a,c)=>a+weights[c],0);let allocation=channels.map((c,i)=>({name:c,amount:Math.round(budget*.75*weights[c]/sum)}));allocation[allocation.length-1].amount+=Math.round(budget*.75)-allocation.reduce((a,c)=>a+c.amount,0);const creative=brand.includes('香')||industry.includes('生活方式')?'下班后的 15 分钟，把生活还给自己':'不止于功能，让每一次体验都值得分享';const hook=brand.includes('香')?'今天的疲惫，到家门口就该下班了。':'为什么越来越多人开始关注这个体验？';const stages=[['Reach｜触达','用短视频、KOL/KOC 与场景化内容覆盖目标人群，建立第一印象。'],['Act｜互动','以真实使用场景、互动问答和用户共创推动收藏、评论、预约或进店。'],['Convert｜转化','统一落地页与优惠机制，使用专属链接/二维码追踪来源并优化转化路径。'],['Engage｜留存','用社群、UGC 征集、会员福利与二次触达建立持续关系。']];const kpi=['目标：'+goal[0],'核心指标：'+goal[1],'辅助指标：'+goal[2]];const reachEst=Math.round(budget*.75/35*1000),interaction=Math.round(reachEst*.025),clicks=Math.round(reachEst*.008);const prompt=`你是一名资深整合营销策略师，请基于以下真实 Brief 深化方案，不得虚构品牌既有业绩或市场研究数据。\n品牌：${brand}\n行业：${industry}\n产品卖点：${product}\n目标人群：${audience}\n营销目标：${goal[0]}\n渠道：${channels.join('、')}\n周期：${months}个月；预算：人民币${budget}元；调性：${tone}\n请输出：1. 3条有消费者洞察依据的创意主张（区分假设与事实）；2. RACE策略及每阶段可执行动作；3. 各渠道内容矩阵（主题、形式、开头钩子、CTA、衡量指标）；4. KOL/KOC组合及预算；5. 4周内容排期；6. A/B测试方案；7. 风险及合规检查。所有预测数据注明假设及计算方式。`;
const lines=[`# ${brand}｜整合营销解决方案`,`行业：${industry}｜目标：${goal[0]}｜周期：${months}个月｜预算：${money(budget)}`,`\n## 核心策略`,`目标人群：${audience}`,`差异化卖点：${product}`,`核心传播主张：${creative}`,`传播语气：${tone}`,`\n## RACE 全链路`,...stages.map(s=>`- ${s[0]}：${s[1]}`),`\n## 渠道策略与预算（75% 渠道执行）`,...allocation.map(x=>`- ${x.name}：${money(x.amount)}；${channelAdvice[x.name]}`),`\n## 预算结构`,`渠道及内容投放：${money(Math.round(budget*.75))}（75%）`,`创意制作：${money(Math.round(budget*.15))}（15%）`,`测试与预备金：${money(budget-Math.round(budget*.75)-Math.round(budget*.15))}（10%）`,`\n## KPI 与测量`,...kpi.map(x=>'- '+x),`示例测算（非预测）：假设渠道执行预算全部按 CPM=35元购买曝光，则约 ${reachEst.toLocaleString()} 次曝光；若互动率2.5%，约 ${interaction.toLocaleString()} 次互动；若点击率0.8%，约 ${clicks.toLocaleString()} 次点击。实际结果取决于平台、素材及受众。`,`\n## 内容示例`,`内容主题：${creative}`,`视频/笔记开头：${hook}`,`行动引导：分享你的使用场景，或点击了解产品详情。`,`\n## AI 深化提示词`,prompt];report=lines.join('\n');const html=`<div class="result"><div class="eyebrow">GENERATED CAMPAIGN PLAN</div><h2 style="font-size:24px;margin:8px 0">${safe(brand)}<br><span style="color:var(--accent)">整合营销解决方案</span></h2><div><span class="tag">${safe(goal[0])}</span><span class="tag">${months}个月</span><span class="tag">${money(budget)}</span></div><h3>01 / Strategy Snapshot</h3><p><b>目标受众：</b>${safe(audience)}</p><p><b>差异化卖点：</b>${safe(product)}</p><p><b>核心创意主张：</b>${safe(creative)}</p><h3>02 / RACE 营销漏斗</h3>${stages.map(s=>`<div class="step"><strong>${s[0]}</strong><div>${s[1]}</div></div>`).join('')}<h3>03 / 渠道策略与预算分配</h3>${allocation.map(x=>`<div class="step"><strong>${safe(x.name)} · ${money(x.amount)}</strong><div>${safe(channelAdvice[x.name])}</div></div>`).join('')}<h3>04 / 预算配置</h3><div class="metric-grid"><div class="metric"><small>渠道投放与执行 · 75%</small><strong>${money(Math.round(budget*.75))}</strong></div><div class="metric"><small>创意制作 · 15%</small><strong>${money(Math.round(budget*.15))}</strong></div><div class="metric"><small>测试及预备金 · 10%</small><strong>${money(budget-Math.round(budget*.75)-Math.round(budget*.15))}</strong></div></div><h3>05 / KPI 规划</h3><p>${kpi.map(s=>`<span class="tag">${safe(s)}</span>`).join('')}</p><div class="metric-grid"><div class="metric"><small>示例曝光</small><strong>${reachEst.toLocaleString()}</strong></div><div class="metric"><small>示例互动</small><strong>${interaction.toLocaleString()}</strong></div><div class="metric"><small>示例点击</small><strong>${clicks.toLocaleString()}</strong></div></div><p class="hint">仅为公式演示：假设执行预算均按 CPM ¥35 投放、互动率 2.5%、点击率 0.8%。非实际投放预测，不代表品牌既有数据。</p><h3>06 / 内容创意示例</h3><div class="copy"><b>主题：</b>${safe(creative)}<br><b>开头钩子：</b>${safe(hook)}<br><b>CTA：</b>分享你的使用场景，或点击了解产品详情。</div><h3>07 / AI 创意深化 Prompt</h3><div class="copy" style="max-height:260px;overflow:auto;font-size:12px">${safe(prompt)}</div><button class="secondary" id="promptcopy" style="margin-top:9px">复制 AI Prompt</button><div class="footer">BrandPilot · 演示原型 v1.0 ｜规则引擎生成结构化初稿，配套大模型提示词。预算为示例配置，执行前需结合实际报价及数据验证。</div></div>`;$('output').className='';$('output').innerHTML=html;$('promptcopy').onclick=()=>navigator.clipboard.writeText(prompt).then(()=>toast('AI Prompt 已复制')).catch(()=>fallbackCopy(prompt));['copy','download','print'].forEach(x=>$(x).disabled=false)}
function fallbackCopy(s){const t=document.createElement('textarea');t.value=s;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('已复制')}
$('generate').onclick=build;$('copy').onclick=()=>navigator.clipboard.writeText(report).then(()=>toast('完整方案已复制')).catch(()=>fallbackCopy(report));$('download').onclick=()=>{const blob=new Blob([report],{type:'text/markdown;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='BrandPilot_营销方案.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)};$('print').onclick=()=>window.print();build();
</script></body></html>
